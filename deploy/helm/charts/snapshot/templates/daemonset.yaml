{{- include "snapshot.validateRuntime" . -}}
{{- $hostSocket := include "snapshot.runtimeSocket" . -}}
{{- $hostSocketDir := $hostSocket | dir -}}
{{- $ctrSocket := include "snapshot.runtimeSocketContainer" . -}}
{{- $ctrSocketDir := $ctrSocket | dir -}}
{{- $storageDir := include "snapshot.runtimeStorageDir" . -}}
