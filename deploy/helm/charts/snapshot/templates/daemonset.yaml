apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "snapshot.fullname" . }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snapshot.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "snapshot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "snapshot.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: snapshot-agent
        {{- with .Values.daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.openshift.enabled .Values.daemonset.podAnnotations }}
      annotations:
        {{- if .Values.openshift.enabled }}
        # Pin this DS to the built-in "privileged" SCC even if a higher-priority
        # custom SCC is added later. See openshift/enhancements custom-scc-preemption-prevention.
        # User-supplied podAnnotations cannot override this key.
        openshift.io/required-scc: privileged
        {{- with omit .Values.daemonset.podAnnotations "openshift.io/required-scc" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with .Values.daemonset.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "snapshot.serviceAccountName" . }}
      hostPID: true
      hostIPC: true
      hostNetwork: true
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        # Default: tolerate all taints (allow running on any node)
        - operator: Exists
        {{- with .Values.daemonset.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if and .Values.daemonset.affinity (hasKey .Values.daemonset.affinity "nodeAffinity") }}
      {{- fail "daemonset.affinity.nodeAffinity is not supported because the chart already enforces kubernetes.io/arch=amd64; use daemonset.nodeSelector or daemonset.affinity.podAffinity/podAntiAffinity instead" }}
      {{- end }}
      affinity:
        # cuda-checkpoint only supports x86_64 — never schedule on arm64 nodes
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
        {{- with .Values.daemonset.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      # CUDA checkpoint/restore requires the nvidia container runtime
      runtimeClassName: nvidia
      {{- if .Values.seccomp.deploy }}
      initContainers:
        # Deploy seccomp profile to host before starting the agent
        # This profile blocks io_uring syscalls that CRIU doesn't support
        - name: deploy-seccomp
          image: {{ .Values.daemonset.initContainer.image | default "busybox:latest" }}
          command:
            - sh
            - -c
            - |
              mkdir -p /host-seccomp/profiles
              cp /seccomp-profiles/block-iouring.json /host-seccomp/profiles/block-iouring.json
              echo "Deployed seccomp profile to /var/lib/kubelet/seccomp/profiles/block-iouring.json"
          volumeMounts:
            - name: seccomp-profiles
              mountPath: /seccomp-profiles
              readOnly: true
            - name: host-seccomp
              mountPath: /host-seccomp
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.daemonset.image.repository }}:{{ .Values.daemonset.image.tag }}"
          imagePullPolicy: {{ .Values.daemonset.image.pullPolicy }}
          args:
            - "--runtime"
            - {{ .Values.runtime.type | quote }}
            # In-container socket path. The host socket is bind-mounted here
            # below, so non-default host layouts (k3s, RKE2, CRI-O on RHCOS)
            # still reach a stable in-container path that matches what the
            # snapshot-agent binary's runtime client dials by default.
            - "--runtime-socket"
            - {{ $ctrSocket | quote }}
          securityContext:
            privileged: true
          env:
            # Dynamic values from Kubernetes downward API
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SNAPSHOT_LOG_LEVEL
              value: {{ .Values.daemonset.snapshotLogLevel | quote }}
            {{- if .Values.rbac.namespaceRestricted }}
            # Restrict pod watching to this namespace (namespace-scoped RBAC)
            - name: RESTRICTED_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          volumeMounts:
            # Mount configuration ConfigMap
            - name: config
              mountPath: /etc/snapshot
              readOnly: true
            {{- if and (eq .Values.storage.type "pvc") (eq .Values.storage.accessMode "agentMount") }}
            # Mount the checkpoint PVC directly in namespace-local agent mode
            - name: checkpoints
              mountPath: {{ .Values.storage.pvc.basePath }}
            {{- end }}
            # Mount the runtime socket directory at the conventional
            # in-container path so the agent dials the same path on every
            # cluster regardless of where the host puts the socket
            # (/run/k3s/containerd on k3s, /run/k3s-containerd on RKE2, etc).
            - name: runtime-run
              mountPath: {{ $ctrSocketDir | quote }}
            # Mount kubelet pods directory for volume discovery
            - name: kubelet-pods
              mountPath: /var/lib/kubelet/pods
              readOnly: true
            # Per-container storage: agent reads overlay upperdirs from here
            # to capture the rootfs diff at checkpoint time.
            - name: runtime-storage
              mountPath: {{ $storageDir | quote }}
              readOnly: true
            # Mount host proc for CRIU and runtime PID signaling
            - name: host-proc
              mountPath: /host/proc
            # Mount host cgroup for CRIU (write access needed for cgroup freezer)
            - name: host-cgroup
              mountPath: /sys/fs/cgroup
            # Kubelet PodResources API socket (for GPU UUID discovery)
            - name: kubelet-pod-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
            {{- if and (eq .Values.storage.type "oci") .Values.storage.oci.credentialsSecretRef }}
            # Mount docker config for OCI registry auth
            - name: docker-config
              mountPath: /root/.docker
              readOnly: true
            {{- end }}
          {{- if and (eq .Values.storage.type "s3") .Values.storage.s3.credentialsSecretRef }}
          envFrom:
            - secretRef:
                name: {{ .Values.storage.s3.credentialsSecretRef }}
          {{- end }}
          resources:
            {{- toYaml .Values.daemonset.resources | nindent 12 }}
      volumes:
        # Configuration ConfigMap
        - name: config
          configMap:
            name: {{ include "snapshot.fullname" . }}-config
        {{- if .Values.seccomp.deploy }}
        # Seccomp profile ConfigMap (used by initContainer)
        - name: seccomp-profiles
          configMap:
            name: {{ include "snapshot.fullname" . }}-seccomp
        # Host seccomp directory (for deploying the profile)
        - name: host-seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
        {{- end }}
        {{- if and (eq .Values.storage.type "pvc") (eq .Values.storage.accessMode "agentMount") }}
        - name: checkpoints
          persistentVolumeClaim:
            claimName: {{ .Values.storage.pvc.name }}
        {{- end }}
        # Runtime socket directory on the host (read-write for checkpoint
        # operations). The hostPath is the variable runtime.socketPath dir;
        # the corresponding volumeMount above rebinds it at the conventional
        # in-container path.
        - name: runtime-run
          hostPath:
            path: {{ $hostSocketDir | quote }}
            type: Directory
        # Kubelet pods directory (for volume discovery)
        - name: kubelet-pods
          hostPath:
            path: /var/lib/kubelet/pods
            type: Directory
        # Per-container storage (overlay upperdirs for rootfs-diff capture).
        - name: runtime-storage
          hostPath:
            path: {{ $storageDir | quote }}
            type: Directory
        # Host proc (for CRIU and runtime signaling - needs write access)
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        # Host cgroup (for CRIU)
        - name: host-cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        # Kubelet PodResources API socket directory
        - name: kubelet-pod-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory
        {{- if and (eq .Values.storage.type "oci") .Values.storage.oci.credentialsSecretRef }}
        - name: docker-config
          secret:
            secretName: {{ .Values.storage.oci.credentialsSecretRef }}
        {{- end }}
      {{- with .Values.daemonset.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
