# DeepSeek V3.2 REAP SpinQuant ActKV NVFP4-NextN-Graft, Dynamo production profile.
#
# A4 deployment, single-role TP=8 EP=8 decode-only on an 8-GPU B200 node.
# No prefill/decode disaggregation (the disaggregation path's NIXL/UCX
# transport is fragile; single-role keeps the data path through plain
# NCCL allreduce that the flashinfer-allreduce-fusion path already wins
# on for this DSV3.2-REAP workload).
#
# Indexer stack (fully armed via env vars in spec.envs):
#   - NVFP4 indexer + IndexCache (freq=4 default) + HISA optimized
#   - WMMA cand_score always-on (n_heads<=64)
#   - iter6 mean_pool: predecode + transp + FMA2
#
# HIGGS dense MLA KV is OFF (defaults to --kv-cache-dtype fp8_e4m3). To
# enable: --enable-higgs-dense-2bit-kv-cache + --kv-cache-dtype bfloat16
# + SGLANG_HIGGS_DSA_TRTLLM_FP8=1 + SGLANG_HIGGS_DSA_INLINE_PRODUCER=1.
# (SGLANG_HIGGS_DSA_FUSED_MLA_DECODE is wired but defaults OFF — regresses
# at B<=16/rank; see optimization-playground commit afc6119f8.)
#
# SMC-SD is ON in this manifest (--speculative-algorithm SMC +
# GLM-4-9B-0414-FP8-DeepSeekV32-OMP draft + smc-n-particles 4 etc.).
# Disable for ablation by removing the speculative-* args + smcsd-draft-model
# volume/mount. Spencer 2026-05-30: current testing on 002 runs WITHOUT
# SMC-SD to match 001; this manifest keeps SMC-SD on as the production
# default.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: deepseek-v32-reap-sglang
  namespace: dynamo-system
  labels:
    app.kubernetes.io/name: deepseek-v32-reap-sglang
    app.kubernetes.io/part-of: dynamo-production
    ai-blaise.io/inference-engine: optimization-playground
spec:
  backendFramework: sglang
  envs:
  - name: UCX_TLS
    value: cuda_copy,cuda_ipc,tcp
  - name: HF_HOME
    value: /models
  - name: HF_HUB_OFFLINE
    value: '1'
  - name: HF_XET_HIGH_PERFORMANCE
    value: '1'
  - name: PYTHONUNBUFFERED
    value: '1'
  - name: SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK
    value: '1'
  - name: DYN_TOKENIZER
    value: fastokens
  - name: PYTORCH_ALLOC_CONF
    value: expandable_segments:True,max_split_size_mb:512
  - name: SGLANG_ENABLE_JIT_DEEPGEMM
    value: '1'
  - name: SGLANG_DISABLE_FLASHINFER_FUSED_TOPK_DEEPSEEK
    value: '0'
  - name: SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN
    value: '1'
  - name: SGLANG_MOE_NVFP4_DISPATCH
    value: '1'
  - name: NCCL_IB_DISABLE
    value: '1'
  - name: NCCL_NVLS_ENABLE
    value: '0'
  - name: NCCL_P2P_LEVEL
    value: NVL
  - name: NCCL_P2P_DISABLE
    value: '0'
  - name: NCCL_CUMEM_ENABLE
    value: '0'
  - name: NCCL_ALGO
    value: Ring
  - name: SGLANG_NSA_NVFP4_HISA
    value: '1'
  - name: SGLANG_NSA_NVFP4_HISA_COMPRESSION_RATIO
    value: '4.0'
  - name: SGLANG_NSA_HISA_PAGED_MIN_SEQ_LEN
    value: '0'
  - name: SGLANG_NSA_HISA_PAGED_DECODE_MIN_SEQ_LEN
    value: '0'
  - name: TORCHDYNAMO_VERBOSE
    value: '1'
  - name: TORCH_LOGS
    value: recompiles,graph_breaks
  - name: SGLANG_USE_SGL_NVFP4_FUSED_RMSNORM
    value: '1'
  - name: SGLANG_NSA_NVFP4_HISA_CAND_SCORE_WMMA
    value: '1'
  - name: SGLANG_NSA_NVFP4_HISA_MEAN_POOL_PREDECODE
    value: '1'
  - name: SGLANG_NSA_NVFP4_HISA_MEAN_POOL_TRANSP
    value: '1'
  - name: SGLANG_NSA_NVFP4_HISA_MEAN_POOL_FMA2
    value: '1'
  - name: SGLANG_HIGGS_DSA_TRTLLM_FP8
    value: '1'
  - name: SGLANG_HIGGS_DSA_TRTLLM_DEQUANT_STREAM
    value: '1'
  - name: SGLANG_HIGGS_DSA_TRTLLM_PINGPONG
    value: '1'
  - name: SGLANG_HIGGS_DSA_TRTLLM_DEDICATED_STREAM
    value: '1'
  - name: SGLANG_ENABLE_SPEC_V2
    value: '1'
  - name: SGLANG_SMC_DRAFT_FP8_GEMM_BACKEND
    value: cutlass
  - name: SGLANG_SMC_TARGET_VERIFY_GRAPH
    value: '0'
  services:
    Frontend:
      componentType: frontend
      extraPodSpec:
        mainContainer:
          args:
          - --router-mode
          - kv
          - --router-kv-events
          - --router-reset-states
          - --dyn-chat-processor
          - dynamo
          - --http-port
          - '8000'
          - --decode-fallback
          command:
          - python3
          - -m
          - dynamo.frontend
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          image: localhost/optimization-playground-sglang-runtime:reap-nvfp4-tokenspeed-0.1.1-nodeps-lsefix
          imagePullPolicy: IfNotPresent
          startupProbe:
            failureThreshold: 360
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
          - mountPath: /opt/optimization-playground/python
            name: optimization-playground-python
            readOnly: true
          - mountPath: /models/BlaiseAI/DeepSeek-V3.2-REAP-345B-SpinQuant-ActKV-NVFP4-NextN-Graft
            name: model
            readOnly: true
        nodeSelector:
          kubernetes.io/hostname: a4-us-001-rl9
        tolerations:
        - operator: Exists
        volumes:
        - hostPath:
            path: /home/spencergarnets/work/optimization-playground/python
            type: Directory
          name: optimization-playground-python
        - hostPath:
            path: /models/BlaiseAI/DeepSeek-V3.2-REAP-345B-SpinQuant-ActKV-NVFP4-NextN-Graft
            type: Directory
          name: model
      replicas: 1
    decode:
      componentType: worker
      envFromSecret: hf-token-secret
      extraPodSpec:
        mainContainer:
          args:
          - --model-path
          - /models/BlaiseAI/DeepSeek-V3.2-REAP-345B-SpinQuant-ActKV-NVFP4-NextN-Graft
          - --served-model-name
          - BlaiseAI/DeepSeek-V3.2-REAP-345B-SpinQuant-ActKV-NVFP4-NextN-Graft
          - --host
          - 0.0.0.0
          - --trust-remote-code
          - --quantization
          - compressed-tensors
          - --fp4-gemm-backend
          - auto
          - --fp8-gemm-backend
          - auto
          - --kv-cache-dtype
          - fp8_e4m3
          - --tp
          - '8'
          - --mem-fraction-static
          - '0.85'
          - --max-running-requests
          - '128'
          - --context-length
          - '16384'
          - --max-total-tokens
          - '524288'
          - --cuda-graph-max-bs
          - '128'
          - --moe-a2a-backend
          - none
          - --moe-runner-backend
          - flashinfer_trtllm
          - --disable-custom-all-reduce
          - --disable-flashinfer-autotune
          - --watchdog-timeout
          - '1800'
          - --disable-radix-cache
          - --kv-events-config
          - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}'
          - --dyn-tool-call-parser
          - deepseek_v3_2
          - --dyn-reasoning-parser
          - deepseek_r1
          - --enable-flashinfer-allreduce-fusion
          - --num-continuous-decode-steps
          - '2'
          - --dsa-indexer-mode
          - indexcache-hisa
          - --dsa-indexer-quantization
          - nvfp4_e2m1_ue8m0
          - --hisa-min-seq-len
          - '1'
          - --ep-size
          - '8'
          - --json-model-override-args
          - '{"index_topk": 1024, "index_topk_freq": 4, "hisa_compression_ratio": 4.0, "hisa_block_size": 128, "hisa_block_topk": 64, "hisa_execution_mode": "optimized", "hisa_min_seq_len": 1}'
          - --speculative-algorithm
          - SMC
          - --speculative-draft-model-path
          - /models/smcsd/GLM-4-9B-0414-FP8-DeepSeekV32-OMP
          - --speculative-draft-model-quantization
          - fp8
          - --speculative-draft-attention-backend
          - triton
          - --smc-draft-kv-cache-dtype
          - fp8_e4m3
          - --smc-n-particles
          - '4'
          - --smc-gamma
          - '6'
          - --smc-draft-temperature
          - '0.7'
          - --smc-target-temperature
          - '1.0'
          - --smc-resample-threshold
          - '0.5'
          - --smc-resample-method
          - systematic
          command:
          - python3
          - -m
          - dynamo.sglang
          env:
          - name: POD_UID
            valueFrom:
              fieldRef:
                fieldPath: metadata.uid
          image: localhost/optimization-playground-sglang-runtime:reap-nvfp4-tokenspeed-0.1.1-nodeps-lsefix
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          startupProbe:
            failureThreshold: 360
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
          - mountPath: /opt/optimization-playground/python
            name: optimization-playground-python
            readOnly: true
          - mountPath: /models/BlaiseAI/DeepSeek-V3.2-REAP-345B-SpinQuant-ActKV-NVFP4-NextN-Graft
            name: model
            readOnly: true
          - name: smcsd-draft-model
            mountPath: /models/smcsd/GLM-4-9B-0414-FP8-DeepSeekV32-OMP
            readOnly: true
          workingDir: /workspace
        nodeSelector:
          kubernetes.io/hostname: a4-us-001-rl9
        tolerations:
        - operator: Exists
        volumes:
        - hostPath:
            path: /home/spencergarnets/work/optimization-playground/python
            type: Directory
          name: optimization-playground-python
        - hostPath:
            path: /models/BlaiseAI/DeepSeek-V3.2-REAP-345B-SpinQuant-ActKV-NVFP4-NextN-Graft
            type: Directory
          name: model
        - name: smcsd-draft-model
          hostPath:
            path: /models/smcsd/GLM-4-9B-0414-FP8-DeepSeekV32-OMP
            type: Directory
      replicas: 1
      resources:
        limits:
          gpu: '8'
        requests:
          gpu: '8'
      sharedMemory:
        size: 120Gi
      subComponentType: decode
